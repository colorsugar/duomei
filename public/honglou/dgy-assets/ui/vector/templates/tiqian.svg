<svg xmlns="http://www.w3.org/2000/svg" width="64" height="240" viewBox="0 0 64 240">
<!-- 文字留空：class="text-slot" 的矩形是字框（不可见），data-writing 说明排法；页面用字体把字放进这个框 -->
<rect x="1" y="1" width="62" height="238" fill="#F5E7D2" stroke="#8B7D6D" stroke-width="1.5"/><rect x="6" y="6" width="52" height="228" fill="none" stroke="#C39D75" stroke-width="1"/><rect x="12" y="20" width="40" height="200" class="text-slot" data-writing="vertical-rl" fill="none" stroke="none"/>
</svg>
