<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28">
<!-- 文字留空：class="text-slot" 的矩形是字框（不可见），data-writing 说明排法；页面用字体把字放进这个框 -->
<rect x="1" y="1" width="26" height="26" rx="2" fill="#933C2D"/><rect x="3.5" y="3.5" width="21" height="21" fill="none" stroke="#F5E7D2" stroke-width="0.8"/><rect x="5" y="5" width="18" height="18" class="text-slot" data-writing="grid" data-style="白文" fill="none" stroke="none"/>
</svg>
