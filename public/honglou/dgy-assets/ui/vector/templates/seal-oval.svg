<svg xmlns="http://www.w3.org/2000/svg" width="64" height="112" viewBox="0 0 64 112">
<!-- 文字留空：class="text-slot" 的矩形是字框（不可见），data-writing 说明排法；页面用字体把字放进这个框 -->
<ellipse cx="32" cy="56" rx="28" ry="52" fill="none" stroke="#933C2D" stroke-width="4"/><rect x="18" y="16" width="28" height="80" class="text-slot" data-writing="vertical-rl" fill="none" stroke="none"/>
</svg>
