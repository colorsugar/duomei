<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
<!-- 文字留空：class="text-slot" 的矩形是字框（不可见），data-writing 说明排法；页面用字体把字放进这个框 -->
<rect x="4" y="4" width="88" height="88" rx="2" fill="#933C2D"/><rect x="14" y="14" width="68" height="68" class="text-slot" data-writing="grid" data-style="白文：字用宣纸色" fill="none" stroke="none"/>
</svg>
