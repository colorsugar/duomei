<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
<!-- 文字留空：class="text-slot" 的矩形是字框（不可见），data-writing 说明排法；页面用字体把字放进这个框 -->
<circle cx="40" cy="40" r="36" fill="#933C2D"/><circle cx="40" cy="40" r="30" fill="none" stroke="#F5E7D2" stroke-width="1.5"/><rect x="20" y="20" width="40" height="40" class="text-slot" data-writing="grid" data-style="白文" fill="none" stroke="none"/>
</svg>
