<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6ead8" />
  <meta name="description" content="多美的夏日小院 — 一个悬浮在云上的夏天" />
  <title>多美的夏日小院</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%232f7a38'/%3E%3Ccircle cx='16' cy='16' r='11.5' fill='%23f6efe4'/%3E%3Ccircle cx='16' cy='16' r='9.2' fill='%23e23b45'/%3E%3Ccircle cx='12' cy='15' r='1.1' fill='%2324160f'/%3E%3Ccircle cx='17' cy='18' r='1.1' fill='%2324160f'/%3E%3Ccircle cx='19' cy='13' r='1' fill='%2324160f'/%3E%3C/svg%3E" />
  <script>
    // Inside duomei.site the scene is embedded by the /xiaoyuan shell (?embed=1), which
    // supplies the back link and title; a direct top-level visit is sent to that shell (/jiangnan for the garden).
    (function () {
      var q = new URLSearchParams(location.search);
      if (q.get('scene') === 'garden') { // 诗语江南: the loader unrolls the handscroll — fetch it first
        var src = (location.pathname.indexOf('/xiaoyuan-scene/') === 0 ? '/xiaoyuan-scene/' : '/') + 'assets/garden/painting-titled.jpg';
        document.documentElement.classList.add('is-garden');
        document.documentElement.style.setProperty('--scroll-img', 'url(' + src + ')');
        var pl = document.createElement('link'); pl.rel = 'preload'; pl.as = 'image'; pl.href = src; pl.setAttribute('fetchpriority', 'high'); document.head.appendChild(pl);
      }
      if (q.has('embed')) document.documentElement.classList.add('is-embed');
      else if (!q.has('standalone') && !q.has('debug') && window.top === window.self && /\/xiaoyuan-scene\//.test(location.pathname)) location.replace(q.get('scene') === 'garden' ? '/jiangnan' : '/xiaoyuan');
    })();
  </script>
  <script type="module" crossorigin src="/xiaoyuan-scene/assets/index-CdmCUQ3r.js"></script>
  <link rel="stylesheet" crossorigin href="/xiaoyuan-scene/assets/index-L8-FynI7.css">
</head>
<body>
  <div id="app">
    <canvas id="view"></canvas>

    <header id="brand">
      <h1>多美的夏日小院</h1>
      <p>一个悬浮在云上的夏天</p>
    </header>

    <a id="fish-credit" hidden href="https://sketchfab.com/3d-models/koi-fish-236859b809984f52b70c94fd040b9c59" target="_blank" rel="noopener">锦鲤：7PLUS · CC BY 4.0</a>
    <div id="hover-label" hidden></div>
    <aside id="info-card" hidden aria-live="polite">
      <button type="button" class="info-close" aria-label="关闭介绍">×</button>
      <h2></h2>
      <p class="info-en"></p>
      <dl>
        <dt>用途</dt><dd class="info-use"></dd>
        <dt>意义</dt><dd class="info-meaning"></dd>
      </dl>
    </aside>
    <footer id="dock">
      <section id="tour-controls" hidden aria-label="自动游玩控制">
        <div class="tour-copy"><strong id="tour-title" role="status" aria-live="polite"></strong><p id="tour-detail"></p><small id="tour-progress"></small></div>
        <div class="tour-buttons"><button type="button" id="tour-next">下一站</button><button type="button" id="tour-pause" aria-pressed="false">暂停</button><button type="button" id="tour-end">结束</button></div>
      </section>
      <div class="tod">
        <p id="hint">双击任意处放大查看 · 双击天空回全景<br>点点看：多美 · 西瓜 · 猫咪 · 荷花缸 · 推门看画，入诗语江南</p>
        <label class="sr-only" for="tod">时间</label>
        <input id="tod" type="range" min="0" max="1" step="0.001" value="0.5" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0.5" aria-valuetext="黄昏" />
        <div class="stops" role="group" aria-label="时辰">
          <button type="button" data-tod="0">午后</button>
          <button type="button" data-tod="0.27" hidden>晴午</button>
          <button type="button" data-tod="0.5" class="is-current">黄昏</button>
          <button type="button" data-tod="1">夜晚</button>
        </div>
      </div>
      <div id="rain-controls" class="rain-controls" hidden>
        <label for="rain-amount">雨量 <output id="rain-label">随时辰</output></label>
        <input id="rain-amount" type="range" min="0" max="50" step="1" value="0" aria-label="雨量" />
        <button id="rain-auto" type="button">随时辰</button>
      </div>
      <div class="actions">
        <button type="button" id="btn-overview" hidden>返回全景</button>
        <button type="button" id="btn-tour" aria-pressed="false" disabled>自动游玩</button>
        <button type="button" id="btn-scene" hidden>回小院</button>
        <button type="button" id="btn-feed" hidden>投食</button>
        <button type="button" id="btn-growth" hidden aria-pressed="false">看花开</button>
        <button type="button" id="btn-walk" aria-pressed="false">第一人称</button>
        <button type="button" id="btn-flight" aria-pressed="false">自由飞行</button>
        <button type="button" id="btn-rotate" aria-pressed="true">自动旋转</button>
        <button type="button" id="btn-audio" aria-pressed="true">声音</button>
        <button type="button" id="btn-shot">截图</button>
        <button type="button" id="btn-full" aria-pressed="false">全屏</button>
      </div>
    </footer>

    <div id="walk-aim" hidden><span>+</span><p id="walk-action"></p></div>
    <p id="flight-hint" hidden>点击画面锁定鼠标 · WASD 移动 · 空格上升 · Shift / Ctrl 下降 · Esc 释放鼠标</p>
    <p id="toast" hidden></p>
    <div id="fps" hidden>0 fps</div>

    <div id="loading" role="status" aria-live="polite">
      <div class="melon" aria-hidden="true">
        <div class="melon-disc">
          <i></i><i></i><i></i><i></i><i></i>
        </div>
      </div>
      <div class="scroll-loader" aria-hidden="true"><div class="scroll-paper"><div class="scroll-art"></div></div><i class="scroll-rod"></i><i class="scroll-rod"></i></div>
      <p class="loading-copy">正在搭建多美的小院…</p>
      <p id="loading-pct">0%</p>
      <div class="loading-bar" aria-hidden="true"><span id="loading-fill"></span></div>
    </div>
  </div>
</body>
</html>
