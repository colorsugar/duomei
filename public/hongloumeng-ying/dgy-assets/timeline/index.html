:root{--paper:#f3ecdc;--heart:#f7f1e3;--silk:#d9d2c0;--wood:#5a3f2b;--ink:#2d2a24;--muted:#6a6255;--red:#a8402e;--gold:#b8975a;--left:120px;font-family:"Songti SC","Noto Serif CJK TC","Noto Serif CJK SC",serif;color:var(--ink);background:#e8dfcd;color-scheme:light}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#f9f4e9,transparent 70%),repeating-linear-gradient(95deg,#8d725408 0 1px,transparent 1px 7px),#e8dfcd;overscroll-behavior:none}button,input,select{font:inherit;appearance:none;color:inherit}button{cursor:pointer;user-select:none;-webkit-user-select:none;border:1px solid var(--gold);background:var(--paper);border-radius:2px;padding:6px 12px}button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--red);outline-offset:3px}button:disabled{opacity:.4;cursor:default}[hidden]{display:none!important}button,input,select{touch-action:manipulation}img{object-fit:cover}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#b8975a9c;border-radius:6px}::-webkit-scrollbar-track{background:transparent}*{scrollbar-width:thin;scrollbar-color:#b8975a9c transparent}
.page{max-width:1320px;margin:0 auto;padding:26px 40px 18px;min-width:0}.control-layer{height:70px;display:flex;justify-content:space-between;align-items:center;padding:0 36px 0 150px;position:relative}.identity{position:absolute;left:30px;top:7px;z-index:4;display:flex;gap:7px}.title-slip{writing-mode:vertical-rl;font:27px 长卷行书,长卷补字,serif;letter-spacing:3px;padding:16px 6px 18px;border:1px solid #a08b6680;background:var(--heart);box-shadow:2px 3px 7px #47371e15;line-height:1.15}.identity small{writing-mode:vertical-rl;font-size:11px;letter-spacing:2px;padding-top:20px}.bookseal{display:flex;align-items:center;justify-content:center;position:absolute;left:49px;top:112px;width:23px;height:23px;color:var(--red);border:1px solid var(--red);font:17px 长卷行书,长卷补字,serif;transform:rotate(-6deg)}.control-note{font-size:12px;color:var(--muted);padding-left:5px;letter-spacing:2px}.toolbar{display:flex;align-items:center;gap:12px}.stamp-button{display:flex;align-items:center;justify-content:center;flex-shrink:0;width:36px;height:36px;border-radius:50%;padding:0;background:var(--heart);border:1px solid var(--red);color:var(--red);font-size:12px;box-shadow:inset 0 0 0 3px var(--heart),inset 0 0 0 4px #a8402e50}.stamp-button[aria-pressed="true"]{color:#fff7e6;background:var(--red);box-shadow:inset 0 0 0 3px var(--red),inset 0 0 0 4px #fff7e655}.stamp-button:hover{transform:translateY(-2px)}.jump{display:flex;gap:5px;align-items:center;font-size:12px;margin:0}.jump input{width:42px;height:29px;text-align:center;border:1px solid #5a503c;background:var(--heart);font-size:14px;border-radius:0}.jump input::-webkit-inner-spin-button{appearance:none}.jump button{height:29px;padding:3px 8px;color:var(--red)}.jump-panel{position:absolute;right:36px;top:63px;z-index:6;border:1px solid var(--gold);padding:12px 16px;background:var(--paper);box-shadow:0 4px 12px #46341f20}.person-panel{position:absolute;right:36px;top:63px;z-index:6;background:var(--paper);border:1px solid var(--gold);padding:1 flags.addEventListener('click',(e)=>{if(performance.now()<suppressClickUntil)return;const id=e.target.closest('.flag')?.dataset.id;const f=flagLayout.find((item)=>item.id===id);if(f){if(DGY&&DGY.event(f.id))return;showGroup(f);}});
laneNames.addEventListener('click',(e)=>{if(performance.now()<suppressClickUntil)return;const id=e.target.closest('[data-person]')?.dataset.person;if(id){if(DGY&&DGY.person(id))return;showPerson(id);}});
if(DGY){const x=document.createElement('button');x.type='button';x.className='dgy-close';x.textContent='合上';x.title='合上长卷，回园子（Esc）';x.onclick=()=>DGY.close();document.body.append(x);
 const st=document.createElement('style');st.textContent='.dgy-close{position:fixed;z-index:40;top:max(10px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));padding:6px 12px;font:14px "Songti SC","STSong",serif;letter-spacing:4px;color:#2d2a24;background:#f4ecd9;border:1px solid #a8402e;border-radius:2px;cursor:pointer;box-shadow:0 2px 6px #46341f30}.dgy-close:hover{color:#a8402e}';document.head.append(st);
 addEventListener('keydown',(e)=>{if(e.key==='Escape'&&!dialog.open){e.preventDefault();DGY.close();}});}
function filterPeople(id){selected=id;activePeople=id?people.filter(p=>p.id===id):(everyone?people:mainPeople);laneScroll.scrollTop=0;$('laneSpacer').style.height=`${activePeople.length*ROW}px`;invalidate();}
for(const p of people){const o=node('option',p.名);o.value=p.id;$('personFilter').append(o);}
$('personFilter').addEventListener('change',e=>filterPeople(e.target.value));laneScroll.addEventListener('scroll',invalidate,{passive:true});
$('fitAll').addEventListener('click',()=>fit());$('fitGarden').addEventListener('click',()=>fit(16.5,80.5));$('fitTen').addEventListener('click',()=>go(start+count()/2,10));
$('peopleToggle').addEventListener('click',()=>{$('personPanel').hidden=!$('personPanel').hidden;$('jumpPanel').hidden=true;});
$('showEveryone').addEventListener('click',()=>{everyone=!everyone;$('showEveryone').textContent=everyone?'收为主角十三人':'展开三十七人';$('personFilter').options[0].textContent=everyone?'全部三十七人':'主角十三人';$('peopleToggle').setAttribute('aria-pressed',String(everyone));filterPeople(selected);});
$('jumpToggle').addEventListener('click',()=>{const p=$('jumpPanel');p.hidden=!p.hidden;$('jumpToggle').setAttribute('aria-expanded',String(!p.hidden));$('personPanel').hidden=true;if(!p.hidden)$('chapterInput').focus();});
$('jumpForm').addEventListener('submit',e=>{e.preventDefault();const n=Number($('chapterInput').value);if(Number.isInteger(n)&&n>=1&&n<=120){go(n,10);$('jumpPanel').hidden=true;$('jumpToggle').setAttribute('aria-expanded','false');}else $('message').textContent='请填 1 到 120 的整数回数。';});

// 横拖由长卷处理，人物区的上下滚动交给浏览器。两指中点是缩放锚点。
function localX(clientX){return clientX-stage.getBoundingClientRect().left;}
function pointerStart(e) {
  if(e.button!==0 || e.target.closest('.edge-guard') || e.target.closest('.person-name'))return;
  stop();pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  // 不抢按钮的点击目标；鼠标/触摸移出舞台后仍由 window 收尾。
  if(!e.target.closest('button'))stage.setPointerCapture(e.pointerId);
  if(pointers.size===1){gesture={x:e.clientX,y:e.clientY,lastX:e.clientX,lastY:e.clientY,t:performance.now(),moved:false,vertical:false};pinch=null;}
  else if(pointers.size===2){const [a,b]=[...pointers.values()];const mid=(a.x+b.x)/2;pinch={distance:Math.hypot(a.x-b.x,a.y-b.y),scale,chapter:chapterAt(localX(mid))};if(gesture)gesture.moved=true;suppressClickUntil=performance.now()+500;}
}
function pointerMove(e) {
  if(!pointers.has(e.pointerId))return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2 && pinch){const [a,b]=[...pointers.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),mid=localX((a.x+b.x)/2);scale=clamp(pinch.scale*d/Math.max(1,pinch.distance),minimum(),480);start=pinch.chapter-(mid-left)/scale;constrain();invalidate();return;}
  if(!gesture || pinch)return;
  const dx=e.clientX-gesture.lastX,dy=e.clientY-gesture.lastY,t=performance.now(),dt=Math.max(4,t-gesture.t);
  if(!gesture.moved && Math.hypot(e.clientX-gesture.x,e.clientY-gesture.y)>7){gesture.moved=true;gesture.vertical=Math.abs(e.clientY-gesture.y)>Math.abs(e.clientX-gesture.x);}
  if(gesture.moved && !gesture.vertical){pan(dx);velocity=dx/dt;stage.classList.add('dragging');suppressClickUntil=t+250;}
  else if(gesture.moved && gesture.vertical && e.pointerType==='touch' && !e.target.closest('.lane-scroll')){window.scrollBy(0,-dy);}
  gesture.lastX=e.clientX;gesture.lastY=e.clientY;gesture.t=t;
}
function pointerEnd(e) {
  if(!pointers.has(e.pointerId))return;
  const cancelled=e.type==='pointercancel';pointers.delete(e.pointerId);
  if(pinch || cancelled || reduced.matches || gesture?.vertical || !gesture?.moved || performance.now()-(gesture?.t||0)>90)velocity=0;
  if(pointers.size===1){const a=[...pointers.values()][0];gesture={x:a.x,y:a.y,lastX:a.x,lastY:a.y,t:performance.now(),moved:true,vertical:false};pinch=null;velocity=0;}
  if(pointers.size===0){pinch=null;gesture=null;stage.classList.remove('dragging');if(velocity)invalidate();}
}
stage.addEventListener('pointerdown',pointerStart);window.addEventListener('pointermove',pointerMove);window.addEventListener('pointerup',pointerEnd);window.addEventListener('pointercancel',pointerEnd);
stage.addEventListener('wheel',(e)=>{
  if(e.target.closest('.lane-scroll') && !e.ctrlKey&&!e.metaKey&&!e.shiftKey && Math.abs(e.deltaY)>Math.abs(e.deltaX))return;
  e.preventDefault();stop();const unit=e.deltaMode===1?16:e.deltaMode===2?H:1;
  if(e.shiftKey || Math.abs(e.deltaX)>Math.abs(e.deltaY))pan(-(e.deltaX||e.deltaY)*unit);
  else zoom(Math.exp(clamp(-e.deltaY*unit*.0025,-1,1)),clamp(localX(e.clientX),left,W-right));
},{passive:false});
stage.addEventListener('dblclick',(e)=>{if(!e.target.closest('button'))zoom(2,clamp(localX(e.clientX),left,W-right));});
function keyNavigate(e){if(e.target.matches('input,select,button'))return;let handled=true;stop();if(e.key==='ArrowLeft')pan(visibleWidth()*.15);else if(e.key==='ArrowRight')pan(-visibleWidth()*.15);else if(e.key==='+'||e.key==='=')zoom(1.5);else if(e.key==='-')zoom(1/1.5);else if(e.key==='Home'){start=.5;invalidate();}else if(e.key==='End'){start=120.5-count();invalidate();}else handled=false;if(handled)e.preventDefault();}
stage.addEventListener('keydown',keyNavigate);mini.addEventListener('keydown',keyNavigate);
function miniChapter(e){return clamp((e.clientX-mini.getBoundingClientRect().left)/miniW*120+.5,.5,120.5);}
mini.addEventListener('pointerdown',(e)=>{if(e.button!==0)return;stop();const c=miniChapter(e);const inside=c>=start && c<=start+count();miniDrag={offset:inside?c-start:count()/2};start=c-miniDrag.offset;constrain();mini.setPointerCapture(e.pointerId);invalidate();});
mini.addEventListener('pointermove',(e)=>{if(!miniDrag)return;start=miniChapter(e)-miniDrag.offset;constrain();invalidate();});
for(const name of ['pointerup','pointercancel','lostpointercapture'])mini.addEventListener(name,()=>{miniDrag=null;});

// 供自测读取的状态，无后台计时器；空闲时不重画。
window.timelinePrototype={data,fitAll:()=>fit(),view:(a,b)=>fit(a-.5,b+.5),go,showEvent,showChapter,close:closeCard,
  state:()=>({start,end:start+count(),scale,width:W,height:H,left,right,velocity,activePointers:pointers.size,stats:{...stats}})};
$('laneSpacer').style.height=`${activePeople.length*ROW}px`;
new ResizeObserver(resize).observe(stage);new ResizeObserver(()=>invalidate()).observe(mini);
reduced.addEventListener('change',()=>{if(reduced.matches)stop();});
resize();
})();
</script></body></html>
