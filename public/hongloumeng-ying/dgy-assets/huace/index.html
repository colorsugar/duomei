<p id="toast" class="toast" role="status" hidden></p>
<script>
'use strict';
const DEFAULT_CONFIG={notesPath:'../text/notes-album-haitang-zanghua.json',poemsNotesPath:'../poems-notes.json',textPath:'../text/hlm/',suppressedOrigins:['zz005','zz019','zz093'],onVisit:null,onPerson:null};
const CONFIG=Object.assign({},DEFAULT_CONFIG,window.HUAZHONG_CONFIG||{});
const ALBUMS={};
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const cn=n=>n<11?'零一二三四五六七八九十'[n]:n<20?'十'+cn(n-10):cn(Math.floor(n/10))+'十'+(n%10?cn(n%10):'');
const chapterName=n=>'第'+cn(n)+'回';
const chapterCache=new Map(),noteIndex=new Map(),imageCache=new Map();
function preloadNeighbors(){const pages=ALBUMS[current].pages;[pageIndex-1,pageIndex+1].forEach(i=>{if(!pages[i]||imageCache.has(pages[i].img))return;const image=new Image();image.src=pages[i].img;imageCache.set(pages[i].img,image);image.decode().catch(()=>{})})}let TERMS=[],notesLoaded=false,originalOpen=false,sourceChapter=37,sourceParagraph=6,vertical=false,sourceRequest=0;
let current='haitang',pageIndex=3,busy=false,turnRequest=0,noteAnchor=null,readerReturn=null,readerTarget=null,lastAudio=0,audioContext=null,inkToken=0,toastTimer;
const audioEvents=[];
const nameMap={baoyu:'贾宝玉',daiyu:'林黛玉',baochai:'薛宝钗',tanchun:'贾探春',liwan:'李纨',yingchun:'贾迎春',xichun:'贾惜春',xiangyun:'史湘云',qingwen:'晴雯',xiren:'袭人',zijuan:'紫鹃',xueyan:'雪雁',jiazheng:'贾政'};
const conservativeDefinitions={zz005:'莲社是后世文人雅集常用的称呼。探春借它说：结社吟诗不该只是男子的事。',zz019:'竹竿带斑点的竹子，也叫斑竹。相传舜的两位妃子哭泣，泪洒竹上成斑。探春借这个传说给黛玉起号「潇湘妃子」。',zz093:'一种鸟，诗中常与暮春和哀愁相连。这一声啼鸣，也催人想起春将尽。'};
function stored(key,fallback){try{const v=localStorage.getItem('huazhong-v4-'+key);return v?JSON.parse(v):fallback}catch(e){return fallback}}
function storeValue(key,value){try{localStorage.setItem('huazhong-v4-'+key,JSON.stringify(value))}catch(e){toast('这次读到的页，暂留在案上。')}}
function pageData(){return ALBUMS[current].pages[pageIndex]}
function toast(message){$('#toast').textContent=message;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,2600)}
async function tween(el,frames,ms){const f=reduced()?frames.map(x=>({opacity:x.opacity==null?1:x.opacity})):frames;const a=el.animate(f,{duration:reduced()?120:ms,easing:'cubic-bezier(.2,.8,.2,1)'});try{await a.finished}catch(e){}}
// 纸声为 Web Audio 合成占位：不自动播放，首个真实交互解锁；150ms 内重复合并。
function prepareAudio(){if(audioContext)return;try{audioContext=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function paperSound(){if(performance.now()-lastAudio<150)return;lastAudio=performance.now();audioEvents.push({time:performance.now(),type:'paper'});if(!audioContext){try{audioContext=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}}if(audioContext.state==='suspended')audioContext.resume();const length=Math.floor(audioContext.sampleRate*.18),buffer=audioContext.createBuffer(1,length,audioContext.sampleRate),samples=buffer.getChannelData(0);for(let i=0;i<length;i++)samples[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/length)*.055;const noise=audioContext.createBufferSource(),filter=audioContext.createBiquadFilter(),gain=audioContext.createGain();noise.buffer=buffer;filter.type='bandpass';filter.frequency.value=1400;gain.gain.value=.7;noise.connect(filter);filter.connect(gain);gain.connect(audioContext.destination);noise.start()}
async function fetchJson(url){const r=await fetch(url);if(!r.ok)throw new Error('读取失败 '+r.status);return r.json()}
function chapter(n){if(!chapterCache.has(n))chapterCache.set(n,fetchJson(CONFIG.textPath+'第'+String(n).padStart(3,'0')+'回.json').catch(e=>{chapterCache.delete(n);throw e}));return chapterCache.get(n)}
async function loadNotes(){try{const results=await Promise.allSettled([fetchJson(CONFIG.notesPath),fetchJson(CONFIG.poemsNotesPath)]);if(results[0].status!=='fulfilled')throw results[0].reason;TERMS=results[0].value.词条||[];TERMS.forEach(t=>noteIndex.set(t.id,t));if(results[1].status==='fulfilled'){const works=results[1].value.作品||{};for(const [id,w] of Object.entries(works)){if(!id.startsWith('haitang-')&&id!=='zanghua-yin')continue;(w.典故||[]).forEach((t,i)=>{if(!TERMS.some(n=>(n.写法||[]).includes(t.原词))){const note={id:'poem-'+id+'-'+i,词:t.原词,类:'诗笺字注',写法:[t.原词],册:[id.startsWith('haitang-')?'haitang':'zanghua'],释义:t.解,出处:null,链:{}};TERMS.push(note);noteIndex.set(note.id,note)}})}}else{$('#status').hidden=false;$('#status').textContent='诗笺字注未至，画册字注仍可点读。'}notesLoaded=true;return true}catch(e){$('#status').hidden=false;$('#status').textContent='字注未能读取。';const b=document.createElement('button');b.textContent='重取字注';b.onclick=async()=>{b.disabled=true;if(await loadNotes()){await renderPage(false);$('#status').hidden=true}else b.disabled=false};$('#status').append(b);return false}}
function matches(){return TERMS.filter(t=>(t.册||[]).includes(current)).flatMap(t=>(t.写法||[t.词]).map(word=>({word,term:t}))).sort((a,b)=>b.word.length-a.word.length)}
function annotated(text,seen,highlight){const frag=document.createDocumentFragment(),options=matches();let position=0,plain='';function flush(){if(plain){frag.append(document.createTextNode(plain));plain=''}}while(position<text.length){const hit=options.find(x=>text.startsWith(x.word,position));if(!hit){plain+=text[position++];continue}flush();const t=hit.term,isPerson=t.类==='人名',duplicate=isPerson&&seen.has(t.id);const el=document.createElement('button');el.type='button';el.dataset.term=t.id;if(duplicate){el.className='person-inline';el.append(document.createTextNode(hit.word));const mark=document.createElement('span');mark.className='person-mark';mark.textContent='见人物';el.append(mark);el.setAttribute('aria-label',hit.word+'，见人物');el.onclick=()=>openPerson((t.链.人物||[])[0],el,t)}else{el.className='term';el.textContent=hit.word;el.setAttribute('aria-label',hit.word+'，查看字注');el.onclick=()=>openNote(t,el);if(isPerson)seen.add(t.id)}frag.append(el);position+=hit.word.length}flush();return frag}
function narrationSeen(){const seen=new Set();$$('#narration .term').forEach(el=>{const t=noteIndex.get(el.dataset.term);if(t&&t.类==='人名')seen.add(t.id)});return seen}
function paintNarration(animate){const p=pageData(),n=$('#narration');n.replaceChildren();n.classList.toggle('finished',!animate||reduced());const seen=new Set(),sentences=p.narr.match(/[^。！？]+[。！？]?/g)||[p.narr];sentences.forEach((sentence,i)=>{const span=document.createElement('span');span.className='sentence';span.style.setProperty('--ink-delay',i*240+'ms');span.append(annotated(sentence,seen));n.append(span)});$('#skip-ink').hidden=!animate||reduced();const token=++inkToken;setTimeout(()=>{if(token===inkToken)finishNarration()},sentences.length*240+60)}
function finishNarration(){inkToken++;$('#narration').classList.add('finished');$('#skip-ink').hidden=true}
function cleanPlace(p){return p.place.replace(/（[^）]*）/g,'').replace(/`[^`]*`/g,'').trim()}
function displayPlace(p){return p.title==='花冢'||p.title==='花冢山坡'?'沁芳闸 · 花冢':p.title}
function renderPeople(){const holder=$('#related-people');holder.replaceChildren();const seen=new Set();for(const t of TERMS){if(t.类!=='人名'||!t.册.includes(current))continue;if(!t.写法.some(w=>pageData().narr.includes(w)))continue;for(const id of t.链.人物||[]){if(seen.has(id))continue;seen.add(id);const b=document.createElement('button');b.textContent='见人物 · '+(nameMap[id]||t.词);b.onclick=()=>openPerson(id,b,t);holder.append(b)}}}
async function renderPage(animate=true){const p=pageData(),album=ALBUMS[current];sourceRequest++;$('#note-dialog').close();$('#notes-column').scrollTop=0;$('#album-name').textContent=album.title;$('#chapter-label').textContent=chapterName(p.chapter);$('#season').textContent=p.season||album.season||'';$('#place').textContent=displayPlace(p);$('#art-title').textContent=p.title;$('#art-caption').textContent=album.title+' · 第'+cn(p.no)+'幅';$('#inscription').textContent=album.inscription||'';$('#inscription').hidden=!album.inscription;$('#count').textContent=cn(p.no)+' / '+cn(album.pages.length);$('#progress').style.transform='scaleX('+(p.no/album.pages.length)+')';$('#prev').disabled=pageIndex===0;$('#next').disabled=pageIndex===album.pages.length-1;$('#particles').innerHTML=album.mood!=='petal'||(current==='zanghua'&&p.no<=4)?'<img class="smoke" src="img/smoke.webp" alt="">':'<i class="petal"></i><i class="petal"></i><i class="petal"></i>';$('#art-loading').hidden=false;const art=$('#art');const onload=()=>$('#art-loading').hidden=true;art.onload=onload;art.onerror=()=>{$('#art-loading').replaceChildren(document.createTextNode('画纸未至。'));const retry=document.createElement('button');retry.textContent='重取画纸';retry.onclick=()=>art.src=p.img+'?retry='+Date.now();$('#art-loading').append(retry)};art.alt=p.scene;art.src=p.img;if(art.complete&&art.naturalWidth)onload();paintNarration(animate);renderPeople();sourceChapter=p.chapter;sourceParagraph=p.paragraph;originalOpen=false;$('#source-sheet').hidden=true;$('#source-status').hidden=true;$('#original-toggle').textContent='展原文';$('#original-toggle').setAttribute('aria-expanded','false');storeValue('album-'+current,pageIndex);preloadNeighbors();return p}
async function flyFromSign(){const book=$('#book'),anchor=$('#book-sign').getBoundingClientRect(),r=book.getBoundingClientRect();if(reduced())return tween(book,[{opacity:0},{opacity:1}],120);await tween(book,[{opacity:0,transform:'translate('+(anchor.left-r.left)+'px,'+(anchor.top-r.top)+'px) scale(.94) rotate(-1.2deg)'},{opacity:1,transform:'none'}],420)}
async function selectAlbum(key,index){if(busy||!ALBUMS[key])return;busy=true;turnRequest++;current=key;pageIndex=index==null?ALBUMS[key].cover:Math.max(0,Math.min(ALBUMS[key].pages.length-1,index));$$('[data-album]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.album===key)));$('#book').hidden=false;$('#closed').hidden=true;await renderPage();paperSound();await flyFromSign();busy=false}
async function turn(n){if(busy||n<0||n>=ALBUMS[current].pages.length||$('#book').hidden)return;busy=true;const token=++turnRequest,old=pageData(),direction=n>pageIndex?1:-1;$('#note-dialog').close();finishNarration();paperSound();const curl=$('#curl'),shadow=$('#curl-shadow'),painting=$('#painting'),rect=painting.getBoundingClientRect();curl.replaceChildren();if(reduced()){pageIndex=n;await renderPage();await tween(painting,[{opacity:.3},{opacity:1}],120)}else{const strips=12,animations=[];$('#art').src=ALBUMS[current].pages[n].img;curl.hidden=false;curl.classList.add('active');for(let i=0;i<strips;i++){const s=document.createElement('div');s.className='curl-strip';s.style.left=(i*100/strips)+'%';s.style.width=(100/strips+.08)+'%';s.style.backgroundImage='url("'+old.img+'")';s.style.backgroundSize=rect.width+'px '+rect.height+'px';s.style.backgroundPosition=(-i*rect.width/strips)+'px center';curl.append(s);const curve=(base,bend)=>{let x=0,z=0;const width=rect.width/strips;for(let j=0;j<i;j++){const theta=(base+bend*j/strips)*Math.PI/180;x+=width*Math.cos(theta);z-=width*Math.sin(theta)}return 'translate3d('+(x-i*width)+'px,0,'+z+'px) rotateY('+((base+bend*i/strips)*direction)+'deg)'};const a=s.animate([{transform:'translate3d(0,0,0) rotateY(0)',opacity:1},{transform:curve(55,40),opacity:1,offset:.5},{transform:curve(145,30),opacity:0}],{duration:360,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'});animations.push(a)}const shade=shadow.animate([{opacity:0},{opacity:.7,offset:.4},{opacity:0}],{duration:360,easing:'cubic-bezier(.2,.8,.2,1)'});await wait(180);if(token===turnRequest){pageIndex=n;await renderPage()}await Promise.all(animations.map(a=>a.finished.catch(()=>{})));shade.cancel();curl.hidden=true;curl.classList.remove('active');animations.forEach(a=>a.cancel());curl.replaceChildren()}busy=false}
function paragraphHighlight(text,seen,p){const frag=document.createDocumentFragment(),hits=p.chapter===sourceChapter&&p.paragraph===sourceParagraph?p.highlights:[];let pos=0;const ranges=hits.map(q=>({start:text.indexOf(q),end:text.indexOf(q)+q.length})).filter(x=>x.start>=0).sort((a,b)=>a.start-b.start);for(const r of ranges){if(r.start<pos)continue;frag.append(annotated(text.slice(pos,r.start),seen));const mark=document.createElement('mark');mark.append(annotated(text.slice(r.start,r.end),seen));frag.append(mark);pos=r.end}frag.append(annotated(text.slice(pos),seen));return frag}
async function renderSource(){const request=++sourceRequest;$('#source-status').hidden=false;$('#source-status').textContent='且住，正寻这一段……';try{const data=await chapter(sourceChapter);if(request!==sourceRequest)return false;const paragraphs=data.段落,index=paragraphs.findIndex(p=>p.i===sourceParagraph),p=paragraphs[index];if(!p)throw new Error('段落未至');$('#source-label').textContent=chapterName(sourceChapter)+' · 第'+(sourceParagraph+1)+'段';$('#source-text').replaceChildren(paragraphHighlight(p.文,narrationSeen(),pageData()));$('#source-text').classList.toggle('vertical',vertical);$('#para-prev').disabled=index<=0;$('#para-next').disabled=index>=paragraphs.length-1;$('#source-status').hidden=true;requestAnimationFrame(scrollCurrentHighlight);return true}catch(e){if(request!==sourceRequest)return false;$('#source-status').textContent='原文未能读取。';const retry=document.createElement('button');retry.textContent='重取原文';retry.onclick=()=>toggleOriginal(true);$('#source-status').append(retry);return false}}
// 实际布局只在展开/收起时切换一次；320ms 用纸底 scaleY、内容 opacity 和下方两层 FLIP 位移表现延展，不动画高度。
function scrollCurrentHighlight(){const container=$('#source-text'),mark=container.querySelector('mark');if(!mark){container.scrollTop=0;return}if(vertical){container.scrollLeft=mark.offsetLeft-container.offsetLeft}else container.scrollTop=Math.max(0,container.scrollTop+mark.getBoundingClientRect().top-container.getBoundingClientRect().top-8)}
async function toggleOriginal(force,ch,paragraph){if(ch!=null)sourceChapter=ch;if(paragraph!=null)sourceParagraph=paragraph;const open=force==null?!originalOpen:force,button=$('#original-toggle'),sheet=$('#source-sheet');if(open){if(!await renderSource())return;const lower=[$('#related-people'),$('#operations'),$('#folio')],tops=lower.map(el=>el.getBoundingClientRect().top);originalOpen=true;sheet.hidden=false;scrollCurrentHighlight();button.textContent='收原文';button.setAttribute('aria-expanded','true');paperSound();const moves=lower.map((el,i)=>tween(el,[{transform:'translateY('+(tops[i]-el.getBoundingClientRect().top)+'px)'},{transform:'none'}],320));await Promise.all([tween(sheet,[{opacity:0,transform:'scaleY(.94)'},{opacity:1,transform:'scaleY(1)'}],320),...moves])}else{sourceRequest++;const lower=[$('#related-people'),$('#operations'),$('#folio')],tops=lower.map(el=>el.getBoundingClientRect().top);await tween(sheet,[{opacity:1},{opacity:0}],160);originalOpen=false;sheet.hidden=true;button.textContent='展原文';button.setAttribute('aria-expanded','false');await Promise.all(lower.map((el,i)=>tween(el,[{transform:'translateY('+(tops[i]-el.getBoundingClientRect().top)+'px)'},{transform:'none'}],320)))} }
async function adjacentParagraph(delta){const data=await chapter(sourceChapter),i=data.段落.findIndex(p=>p.i===sourceParagraph),next=data.段落[i+delta];if(next){sourceParagraph=next.i;await renderSource();await tween($('#source-text'),[{opacity:.35},{opacity:1}],240)}}
function positionNote(anchor){const d=$('#note-dialog');if(innerWidth<=767)return;const r=anchor.getBoundingClientRect();const width=328,height=d.getBoundingClientRect().height;d.style.left=Math.max(16,Math.min(innerWidth-width-16,r.left))+'px';d.style.top=Math.max(16,Math.min(innerHeight-height-16,r.bottom+10))+'px'}
function openNote(t,anchor){noteAnchor=anchor;const d=$('#note-dialog');$('#note-title').textContent=t.词;$('#note-type').textContent=t.类+(t.音?' · '+t.音:'');$('#note-definition').textContent=conservativeDefinitions[t.id]||t.释义;const suppress=CONFIG.suppressedOrigins.includes(t.id),origin=t.出处;$('#note-origin').hidden=suppress||!origin;$('#note-origin').textContent=!suppress&&origin?chapterName(origin.回)+'\n「'+origin.句+'」'+(origin.典?'\n'+origin.典:''):'';$('#note-links').replaceChildren();for(const id of t.链&&t.链.人物||[]){const b=document.createElement('button');b.textContent='见人物 · '+(nameMap[id]||t.词);b.onclick=()=>{d.close();openPerson(id,anchor,t)};$('#note-links').append(b)}if(origin){const b=document.createElement('button');b.textContent='见原文';b.onclick=async()=>{d.close();const data=await chapter(origin.回).catch(()=>null);if(!data){toast('原文未至，请稍后再试。');return}const p=data.段落.find(x=>x.文.includes(origin.句));if(p)await toggleOriginal(true,origin.回,p.i);anchor.focus({preventScroll:true})};$('#note-links').append(b)}if(!d.open)d.show();positionNote(anchor);tween(d,[{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],220)}
function closeNote(){const d=$('#note-dialog');d.close();if(noteAnchor&&noteAnchor.isConnected)noteAnchor.focus({preventScroll:true})}
function openPerson(id,anchor,term){if(typeof CONFIG.onPerson==='function'){CONFIG.onPerson(id);return}const d=$('#person-dialog'),related=TERMS.filter(t=>t.链&&t.链.人物&&t.链.人物.includes(id)&&t.类==='别号');const own=TERMS.find(t=>t.类==='人名'&&t.链&&t.链.人物&&t.链.人物.includes(id)&&t.词!=='翠墨'&&t.词!=='碧痕'&&t.词!=='贾芸');$('#person-title').textContent=nameMap[id]||term.词;$('#person-body').textContent=own?own.释义:term.释义;$('#person-links').replaceChildren();related.forEach(t=>{const b=document.createElement('button');b.textContent=t.词;b.onclick=()=>{d.close();openNote(t,anchor)};$('#person-links').append(b)});d.showModal()}
async function openReader(){const data=await chapter(sourceChapter).catch(()=>null);if(!data){toast('这一回未能读取，请重取原文。');return}const d=$('#reader'),body=$('#reader-content');readerReturn={focus:document.activeElement,windowY:scrollY,panelY:$('#notes-column').scrollTop,album:current,index:pageIndex};readerTarget=sourceChapter;$('#reader-title').textContent=chapterName(sourceChapter)+' · '+data.回名;body.replaceChildren();for(const p of data.段落){const node=document.createElement('p');node.textContent=p.文;node.dataset.paragraph=p.i;if(p.i===sourceParagraph)node.className='reader-current';body.append(node)}$('#reader-foot').textContent='';d.showModal();const saved=stored('reader-'+sourceChapter,null);body.scrollTop=saved&&saved.paragraph===sourceParagraph?saved.top:Math.max(0,body.querySelector('.reader-current').offsetTop-body.offsetTop);await tween(d,[{opacity:0},{opacity:1}],240)}
function closeReader(){const body=$('#reader-content');storeValue('reader-'+readerTarget,{top:body.scrollTop,paragraph:sourceParagraph});$('#reader').close();if(readerReturn){$('#notes-column').scrollTop=readerReturn.panelY;window.scrollTo(0,readerReturn.windowY);if(readerReturn.focus&&readerReturn.focus.isConnected)readerReturn.focus.focus({preventScroll:true})}}
function showContents(){const album=ALBUMS[current];$('#contents-title').textContent=album.title+' · 看本册各幅';const holder=$('#contents-list');holder.replaceChildren();album.pages.forEach((p,i)=>{const b=document.createElement('button');b.setAttribute('aria-current',String(i===pageIndex));const im=document.createElement('img');im.src=p.img;im.alt=p.title;im.loading='lazy';const label=document.createElement('span');label.textContent=cn(p.no)+' · '+p.title;b.append(im,label);b.onclick=async()=>{$('#contents').close();await turn(i)};holder.append(b)});$('#contents').showModal()}
async function visit(){if(busy)return;const p=pageData(),b=$('#visit'),blot=b.querySelector('.stamp-blot');paperSound();await tween(b,[{transform:'scale(1.25) rotate(-3deg)'},{transform:'scale(.98) translateY(1px)',offset:.6},{transform:'none'}],200);tween(blot,[{opacity:0,transform:'scale(.7)'},{opacity:.15,transform:'scale(1.15)'},{opacity:0}],300);if(typeof CONFIG.onVisit==='function'){CONFIG.onVisit({album:current,page:p.no,place:p.title});return}$('#place-title').textContent=displayPlace(p);$('#place-image').src=p.img;$('#place-image').alt=p.title;$('#place-body').textContent=p.title+'，这一幅的旧事发生在这里。';$('#location-note').textContent=current==='zanghua'&&p.no>=8?'落花归土，余香仍在。':'画里的地方，记在这一页。';$('#place-dialog').showModal()}
async function closeBook(){turnRequest++;sourceRequest++;finishNarration();$('#note-dialog').close();await tween($('#book'),[{opacity:1,transform:'none'},{opacity:0,transform:'translateY(4px)'}],160);$('#book').hidden=true;$('.album-tabs').hidden=true;$('#closed').hidden=false;$('#reopen').focus({preventScroll:true})}
$('#original-toggle').onclick=()=>toggleOriginal();$('#para-prev').onclick=()=>adjacentParagraph(-1);$('#para-next').onclick=()=>adjacentParagraph(1);$('#read-full').onclick=openReader;$('#reader-close').onclick=closeReader;$('#reader').addEventListener('cancel',e=>{e.preventDefault();closeReader()});$('#note-close').onclick=closeNote;$('#skip-ink').onclick=finishNarration;$('#prev').onclick=()=>turn(pageIndex-1);$('#next').onclick=()=>turn(pageIndex+1);$('#contents-open').onclick=showContents;$('#visit').onclick=visit;$('#close-book').onclick=closeBook;$('#book-sign').onclick=closeBook;$('#reopen').onclick=async()=>{$('.album-tabs').hidden=false;$('#closed').hidden=true;$('#book').hidden=false;paperSound();await flyFromSign();$('#original-toggle').focus({preventScroll:true})};$$('[data-album]').forEach(b=>b.onclick=()=>selectAlbum(b.dataset.album));$$('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).close());$('#writing-mode').onclick=()=>{vertical=!vertical;$('#writing-mode').textContent=vertical?'横排':'竖排';$('#writing-mode').setAttribute('aria-pressed',String(vertical));$('#source-text').classList.toggle('vertical',vertical)};
document.addEventListener('pointerdown',e=>{if($('#note-dialog').open&&!e.target.closest('#note-dialog,.term'))$('#note-dialog').close()});document.addEventListener('keydown',e=>{if($('#reader').open||$('#person-dialog').open||$('#contents').open||$('#place-dialog').open)return;if(e.key==='Escape'){if($('#note-dialog').open){e.preventDefault();closeNote()}else if(originalOpen){e.preventDefault();toggleOriginal(false)}else closeBook()}if(e.target.closest('button,input,a,dialog')&&e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;if(e.key==='ArrowRight'){e.preventDefault();turn(pageIndex+1)}if(e.key==='ArrowLeft'){e.preventDefault();turn(pageIndex-1)}});
let touchNote=null,suppressClick=false;document.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')return;const el=e.target.closest('.term');if(!el)return;touchNote={el,x:e.clientX,y:e.clientY,timer:setTimeout(()=>{openNote(noteIndex.get(el.dataset.term),el);suppressClick=true},400)}});function endHold(){if(touchNote)clearTimeout(touchNote.timer);touchNote=null}document.addEventListener('pointermove',e=>{if(touchNote&&(Math.abs(e.clientX-touchNote.x)>8||Math.abs(e.clientY-touchNote.y)>8))endHold()});document.addEventListener('pointerup',endHold);document.addEventListener('pointercancel',endHold);document.addEventListener('click',e=>{if(suppressClick&&e.target.closest('.term')){e.preventDefault();e.stopImmediatePropagation();suppressClick=false}else suppressClick=false},true);
let swipe=null;$('#painting').addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')return;swipe={x:e.clientX,y:e.clientY}});$('#painting').addEventListener('pointerup',e=>{if(!swipe)return;const dx=e.clientX-swipe.x,dy=e.clientY-swipe.y;swipe=null;if(Math.abs(dx)>52&&Math.abs(dx)>Math.abs(dy)*1.3)turn(pageIndex+(dx<0?1:-1))});$('#painting').addEventListener('pointercancel',()=>swipe=null);
document.addEventListener('visibilitychange',()=>{document.body.classList.toggle('motion-paused',document.hidden);document.getAnimations().forEach(a=>{if(document.hidden)a.pause();else if(!reduced())a.play()})});window.addEventListener('resize',()=>{if($('#note-dialog').open&&noteAnchor)positionNote(noteAnchor)});
