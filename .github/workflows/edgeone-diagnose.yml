name: EdgeOne deployment diagnostics

# Manual, read-only: lists the EdgeOne Makers project's recent deployments and
# project record (status, sizes, error fields) with secrets redacted.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many recent deployments to list"
        required: false
        default: "8"
      prune:
        description: "Delete old deployment records (keep newest successes + production)"
        required: false
        default: "0"
      prune_dry:
        description: "Only list what prune would delete"
        required: false
        default: "1"
      keep:
        description: "How many newest successful deployments to keep"
        required: false
        default: "3"
      rotate:
        description: "Tiny preview deploys to run so old artifacts get cleaned (0 = none)"
        required: false
        default: "0"
      preview_site:
        description: "Deploy this ref's whole site as a preview (never production) and probe it"
        required: false
        default: "0"
      assets:
        description: "1 = publish large assets to the duomei-assets project when changed; force = always"
        required: false
        default: "0"
      project_id:
        description: "Project to list (default: main site makers-brifmhu31vjf)"
        required: false
        default: ""
      assets_base:
        description: "Assets origin override for this run (e.g. the project preset domain before assets.duomei.site is bound)"
        required: false
        default: ""
      retire_previews:
        description: "1 = shrink the throwaway isolated preview projects (duomei-slim-preview, duomei-slim-preview-assets, duomei-motion-preview) to a tiny page so their copies leave account storage"
        required: false
        default: "0"
      retire_assets_v1:
        description: "1 = shrink the abandoned first assets project duomei-assets (global area, cannot bind domains) to a tiny page so its 730MB copy leaves storage"
        required: false
        default: "0"
      isolated_preview:
        description: "1 = deploy this ref to isolated preview projects (never production duomei.site / assets.duomei.site) and probe it"
        required: false
        default: "0"
      preview_site_project:
        description: "Isolated EdgeOne project name for the site preview (never duomei-guyu)"
        required: false
        default: "duomei-slim-preview"
      preview_assets_project:
        description: "Isolated EdgeOne project name for preview assets (never duomei-assets-overseas)"
        required: false
        default: "duomei-slim-preview-assets"

permissions:
  contents: read

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/cursor/edgeone-') || startsWith(github.ref, 'refs/heads/cursor/honglou-') || github.ref == 'refs/heads/assets-pages-split' || startsWith(github.ref, 'refs/heads/preview/')
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      EDGEONE_PROJECT_ID: ${{ inputs.project_id || 'makers-brifmhu31vjf' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.1

      - name: List recent EdgeOne deployments
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          LIMIT: ${{ inputs.limit }}
          EDGEONE_PRUNE: ${{ inputs.prune }}
          EDGEONE_PRUNE_DRY: ${{ inputs.prune_dry }}
          EDGEONE_KEEP: ${{ inputs.keep }}
        run: node scripts/edgeone-deploy-diagnose.mjs "${LIMIT:-8}"

      # 10-16：账号存储 5 GiB 被「最近 3 次成功部署」的整站副本（各约 1.1 GB）占满。
      # 部署几次只有一个小页面的 preview（不碰 production），让平台按规则清掉最早的旧副本。
      - name: Rotate out old deployment artifacts with tiny preview deploys
        if: inputs.rotate != '0' && inputs.rotate != ''
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          ROTATE: ${{ inputs.rotate }}
        run: |
          set -euo pipefail
          ( cd "${RUNNER_TEMP}" && npm install -g --legacy-peer-deps "edgeone@1.6.31-3" )
          tiny="${RUNNER_TEMP}/tiny"
          mkdir -p "$tiny"
          for i in $(seq 1 "$ROTATE"); do
            echo "<!doctype html><title>rotate $i</title>" > "$tiny/index.html"
            edgeone makers deploy "$tiny" -n duomei-guyu -t "$EDGEONE_API_TOKEN" -e preview -a global --json | tail -n 1
            sleep 20
          done
          node scripts/edgeone-deploy-diagnose.mjs 6

      # 10-19：第一次建的 duomei-assets 是「含中国大陆」区域，没实名绑不了域名，已改用 overseas 区的新项目。
      # 把它的正式版换成一个小页面，再做 3 次小 preview，让它那份 730MB 副本出存储（不删项目，接口也删不了）。
      - name: Shrink the abandoned global-area assets project
        if: inputs.retire_assets_v1 == '1'
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          set -euo pipefail
          ( cd "${RUNNER_TEMP}" && npm install -g --legacy-peer-deps "edgeone@1.6.31-3" )
          tiny="${RUNNER_TEMP}/retire"
          mkdir -p "$tiny"
          echo '<!doctype html><meta charset="utf-8"><title>moved</title><p>素材已迁到 duomei-assets-overseas。</p>' > "$tiny/index.html"
          edgeone makers deploy "$tiny" -n duomei-assets -t "$EDGEONE_API_TOKEN" -e production -a global --json | tail -n 1
          for i in 1 2 3; do
            sleep 20
            echo "<!doctype html><title>rotate $i</title>" > "$tiny/index.html"
            edgeone makers deploy "$tiny" -n duomei-assets -t "$EDGEONE_API_TOKEN" -e preview -a global --json | tail -n 1
          done

      # 11-25：11-23/24 建的三个独立预览项目占满账号存储，正式素材站部署报 "Build artifacts size exceeds the limit"。
      # 同 retire_assets_v1：正式版换成小页面，再做 3 次小 preview，让大副本出存储。永不碰正式项目。
      - name: Shrink throwaway isolated preview projects
        if: inputs.retire_previews == '1'
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          set -euo pipefail
          ( cd "${RUNNER_TEMP}" && npm install -g --legacy-peer-deps "edgeone@1.6.31-3" )
          tiny="${RUNNER_TEMP}/retire-previews"
          mkdir -p "$tiny"
          # 平台会把「上一个正式版」留作回滚副本，所以正式版要连发两次小页面，大副本才会出存储。
          for spec in duomei-slim-preview:overseas duomei-slim-preview-assets:overseas duomei-motion-preview:overseas duomei-assets:global; do
            name="${spec%%:*}" area="${spec##*:}"
            case "$name" in duomei-guyu|duomei-assets-overseas) echo "refuse $name"; exit 1;; esac
            for j in 1 2; do
              echo "<!doctype html><meta charset=\"utf-8\"><title>retired $j</title><p>预览已下线，正式站见 duomei.site。</p>" > "$tiny/index.html"
              edgeone makers deploy "$tiny" -n "$name" -t "$EDGEONE_API_TOKEN" -e production -a "$area" --json | tail -n 1 || true
              sleep 20
            done
            for i in 1 2; do
              sleep 20
              echo "<!doctype html><title>rotate $i</title>" > "$tiny/index.html"
              edgeone makers deploy "$tiny" -n "$name" -t "$EDGEONE_API_TOKEN" -e preview -a "$area" --json | tail -n 1 || true
            done
          done

      # 大素材单独发到素材项目 duomei-assets（assets.duomei.site），指纹没变就不部署。见 scripts/assets-publish.sh。
      - name: Publish large assets to the assets project
        if: inputs.assets == '1' || inputs.assets == 'force'
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          DUOMEI_ASSETS_BASE: ${{ inputs.assets_base || vars.DUOMEI_ASSETS_BASE }}
          ASSETS_FORCE: ${{ inputs.assets == 'force' && '1' || '0' }}
        run: |
          set -euo pipefail
          ( cd "${RUNNER_TEMP}" && npm install -g --legacy-peer-deps "edgeone@1.6.31-3" )
          SRC_DIR=public bash scripts/assets-publish.sh
          node scripts/assets-split.mjs check --dir public || echo "::warning::素材域名抽查没通过（域名还没绑好时正常）"
          node scripts/edgeone-deploy-diagnose.mjs 6 | grep -E "^  project |^## Deployments" || true

      # 大包上线前先部署成预览版（不碰正式站）并探测能否正常访问。
      # 和正式发布一样先判断拆不拆大素材：素材域名上已是本次素材就拆，预览站就是拆分后的小网站。
      - name: Deploy whole site as preview and probe it
        if: inputs.preview_site == '1'
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          DUOMEI_ASSETS_SPLIT: ${{ vars.DUOMEI_ASSETS_SPLIT }}
          DUOMEI_ASSETS_BASE: ${{ inputs.assets_base || vars.DUOMEI_ASSETS_BASE }}
        run: |
          set -euo pipefail
          npm ci
          npm run build
          bash scripts/assets-site.sh
          node scripts/assets-split.mjs guard --dir dist
          ( cd "${RUNNER_TEMP}" && npm install -g --legacy-peer-deps "edgeone@1.6.31-3" )
          bash scripts/edgeone-preview-probe.sh

      # 瘦身分支预览：素材发到独立项目，主站发到 duomei-guyu 的 preview 环境。
      # 绝不把 -e production 打到 duomei-guyu 或 duomei-assets-overseas。
      - name: Deploy isolated slim preview (production untouched)
        if: inputs.isolated_preview == '1'
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          PREVIEW_SITE_PROJECT: ${{ inputs.preview_site_project || 'duomei-slim-preview' }}
          PREVIEW_ASSETS_PROJECT: ${{ inputs.preview_assets_project || 'duomei-slim-preview-assets' }}
        run: |
          set -euo pipefail
          ok=0
          for i in 1 2 3 4; do
            if ( cd "${RUNNER_TEMP}" && npm install -g --legacy-peer-deps "edgeone@1.6.31-3" ); then
              ok=1
              break
            fi
            echo "edgeone CLI 安装失败（${i}/4），20 秒后重试"
            sleep 20
          done
          [[ "$ok" = "1" ]]
          bash scripts/edgeone-isolated-preview.sh
