name: PR Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloudflare/duomei-media/package-lock.json

      - name: Install site dependencies
        run: npm ci

      - name: Test homepage and navigation contracts
        run: npm run test:home-hold

      - name: Test protected Guyu delivery
        run: npm run test:guyu

      - name: Build full site
        run: npm run build

      - name: Verify release source of truth
        shell: pwsh
        run: ./scripts/verify-release.ps1

      - name: Install media worker dependencies
        run: npm --prefix cloudflare/duomei-media ci

      - name: Check media worker
        run: npm --prefix cloudflare/duomei-media run check

      - name: Test media worker
        run: npm --prefix cloudflare/duomei-media test

      - name: Dry-run media worker bundle
        run: npm --prefix cloudflare/duomei-media run deploy:dry
