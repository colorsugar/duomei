<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>多美 · 云游（整段流程提案）</title>
<style>
@font-face{font-family:FrL;src:url(f/fr-light.woff) format("woff")}
:root{--ink:#1C1916;--paper:#F3EEE6;--red:#B3261E}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"Noto Serif CJK SC","Songti SC",serif;-webkit-font-smoothing:antialiased}
.intro{height:78vh;display:flex;flex-direction:column;justify-content:flex-end;padding:0 6vw 10vh}
.intro .k{font-family:FrL;font-size:11px;letter-spacing:.32em;color:var(--red)}
.intro h1{font-weight:400;font-size:clamp(40px,6vw,84px);letter-spacing:.3em;margin-top:14px}
.intro p{font-size:13px;letter-spacing:.24em;opacity:.6;margin-top:16px;line-height:1.9;max-width:34em}
.intro .down{margin-top:30px;display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.3em;opacity:.55}.intro .down:before{content:"";width:40px;height:1px;background:currentColor}
#pop{position:relative;height:420vh}
#pop .pin{position:sticky;top:0;height:100vh;overflow:hidden}
iframe{display:block;width:100%;height:100%;border:0}
.bridge{height:22vh;background:linear-gradient(var(--paper),#201b17);display:flex;align-items:center;justify-content:center}
.bridge span{font-size:12px;letter-spacing:.4em;color:rgba(243,238,230,.7)}
#car{height:100vh;background:#201b17}
.foot{height:24vh;background:#201b17}
@media(max-width:700px){.intro{height:72vh;padding:0 22px 9vh}.intro h1{font-size:44px}#pop{height:380vh}}
</style></head><body>
<header class="intro"><span class="k">YUNYOU · 云游</span><h1>云游</h1><p>先翻一本纸上山河：桂林、江南、小院，一页一页，景物一件件立起来。<br>合上书，再一幅幅翻看这四件云游作品。</p><div class="down">往下滑 · 入画</div></header>
<section id="pop"><div class="pin"><iframe id="fp" src="storybook.html?embed=1" title="纸上山河"></iframe></div></section>
<div class="bridge"><span>四件云游作品</span></div>
<section id="car"><iframe id="fc" src="carousel.html?only=E" title="云游作品"></iframe></section>
<div class="foot"></div>
<script>
const fp=document.getElementById('fp'),fc=document.getElementById('fc'),pop=document.getElementById('pop'),car=document.getElementById('car');
const now=()=>window.__clock!=null?window.__clock*1000:performance.now();
const io=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
// place tag -> work index in the 云游 carousel (沿水看桂林 0 · 多美的夏日小院 1 · 诗语江南 2 · 紅樓夢影 3)
const WORK=[0,2,1];let anim=null,pend=null,seen=0;
function sync(){
 if(anim){const p=Math.min(1,(now()-anim.s)/1400);scrollTo(0,anim.a+(anim.b-anim.a)*io(p));if(p>=1){anim=null;}}
 const r=pop.getBoundingClientRect(),span=pop.offsetHeight-innerHeight;const p=Math.min(1,Math.max(0,-r.top/span));
 const c=fc.contentWindow,cr=car.getBoundingClientRect();if(!seen&&cr.top<innerHeight*.6){seen=1;pend={k:0,until:now()+3000}}
 if(pend&&c&&c.__go){c.__go('E-云游',pend.k);if(now()>pend.until)pend=null}
 const w=fp.contentWindow;if(w&&w.__setT)w.__setT(r.top>0?0:(r.top<-span?.96:p*.96));
}
addEventListener('message',e=>{if(e.data&&e.data.yunyou!=null){const i=e.data.yunyou;anim={a:scrollY,b:car.offsetTop,s:now()};seen=1;pend={k:WORK[i],until:now()+4000}}});
window.__sync=sync;window.__anim=()=>!!anim;
const loop=()=>{if(window.__clock==null)sync();requestAnimationFrame(loop)};loop();
</script></body></html>
