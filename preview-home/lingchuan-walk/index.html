<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>灵川全境 · 十二乡镇立雕地图与六境长卷</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./map.css">
  <script type="importmap">
    {
      "imports": {
        "three": "../storybook/vendor/three.module.js"
      }
    }
  </script>
</head>
<body data-mode="map" data-segment="lijiang">
  <div id="stage" aria-label="灵川六境三十二景立体山水长卷"></div>
  <div id="map-stage" aria-label="灵川全境立雕地图"></div>
  <div id="vignette" aria-hidden="true"></div>

  <!-- Screen-space collision-avoided rice-paper landmark & portal slips (pool of 4, zero layout reflow) -->
  <div id="tag-layer" class="tag-layer" aria-hidden="true">
    <button type="button" class="paper-tag" data-slot="0"><span class="tag-tick"></span><span class="tag-txt"></span></button>
    <button type="button" class="paper-tag" data-slot="1"><span class="tag-tick"></span><span class="tag-txt"></span></button>
    <button type="button" class="paper-tag" data-slot="2"><span class="tag-tick"></span><span class="tag-txt"></span></button>
    <div id="portal-banner" class="portal-banner" aria-hidden="true">
      <span class="portal-seal">穿镜</span>
      <span id="portal-banner-txt" class="portal-banner-txt">满月石拱镜 · 入古圩</span>
    </div>
  </div>

  <div id="mode-veil" aria-hidden="true"></div>

  <!-- Top Header Bar: Duomei Back Brand + 3-Mode Switch + Gyro & 0/32 Stamp Pill -->
  <header class="top-bar">
    <div class="brand">
      <a class="dm-home-back" href="/" aria-label="返回多美主站">
        <span class="dm-hb-arrow" aria-hidden="true">‹</span>
        <span class="dm-hb-stack"><strong>DUOMEI</strong><em>多美</em></span>
      </a>
      <span class="brand-seal" aria-hidden="true">灵川</span>
      <div class="brand-text">
        <h1>灵川全境</h1>
        <span id="chapter-sub" class="chapter-sub">七镇五乡 · 一脉青绿</span>
      </div>
    </div>

    <div class="mode-switch" role="tablist" aria-label="观看模式">
      <span class="mode-pill-bg" aria-hidden="true"></span>
      <button type="button" class="mode-btn active" data-mode="map" role="tab" aria-selected="true">全境地图</button>
      <button type="button" class="mode-btn" data-mode="walk" role="tab" aria-selected="false">纸艺长卷</button>
      <button type="button" class="mode-btn" data-mode="depth" role="tab" aria-selected="false">2.5D 画境</button>
    </div>

    <div class="top-right">
      <button type="button" id="gyro-btn" class="gyro-btn" aria-pressed="false" title="开启手机体感视差" aria-label="体感视差开关">
        <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="5.5" y="2.5" width="9" height="15" rx="2.2"/>
          <path d="M2.5 10a7.5 7.5 0 0 1 2-5M17.5 10a7.5 7.5 0 0 1-2 5"/>
        </svg>
      </button>
      <div id="stamp-pill" class="stamp-pill" aria-live="polite" title="已集灵川风物印记">
        <span class="stamp-icon" aria-hidden="true">印</span>
        <span id="stamp-count" class="stamp-count">0/32</span>
        <span id="stamp-flash" class="stamp-flash" aria-hidden="true">印</span>
      </div>
    </div>
  </header>

  <!-- Sub-Header Row: Slender 5-Category Filter + Next Portal Quick-Hop -->
  <div id="sub-bar" class="sub-bar">
    <nav id="filter-bar" class="filter-bar" aria-label="风物分类">
      <button type="button" class="filter-btn active" data-cat="all">全部</button>
      <button type="button" class="filter-btn" data-cat="山水">山水</button>
      <button type="button" class="filter-btn" data-cat="古村">古村</button>
      <button type="button" class="filter-btn" data-cat="美食特产">美食特产</button>
      <button type="button" class="filter-btn" data-cat="瑶风民俗">瑶风民俗</button>
    </nav>
    <button type="button" id="next-portal-btn" class="portal-hop-btn" title="直达下一扇画中画穿镜门">
      <span class="portal-hop-dot" aria-hidden="true"></span>
      <span id="next-portal-label">穿镜窥景</span>
    </button>
  </div>

  <!-- Walk Mode Bottom Dock: Progress Track (with 5 Portal Markers) + 6-Realm Capsules -->
  <footer id="walk-dock" class="bottom-dock">
    <div class="journey-track-wrap">
      <div id="journey-track" class="journey-track" role="slider" aria-label="六境长卷进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
        <div class="journey-rail"></div>
        <div id="journey-fill" class="journey-fill"></div>
        <i class="portal-tick" style="left:16.5%" title="穿镜一：入古圩"></i>
        <i class="portal-tick" style="left:33.5%" title="穿镜二：寻祠堂"></i>
        <i class="portal-tick" style="left:50.0%" title="穿镜三：入秘境"></i>
        <i class="portal-tick" style="left:66.5%" title="穿镜四：踏金秋"></i>
        <i class="portal-tick" style="left:82.5%" title="穿镜五：赴夜市"></i>
        <div id="journey-thumb" class="journey-thumb"></div>
      </div>
    </div>
    <nav id="chapter-nav" class="chapter-pills" aria-label="灵川六境">
      <button type="button" class="chapter-pill active" data-seg="0">
        <i class="pill-dot" aria-hidden="true"></i><span>漓江洲渚</span>
      </button>
      <button type="button" class="chapter-pill" data-seg="1">
        <i class="pill-dot" aria-hidden="true"></i><span>大圩古街</span>
      </button>
      <button type="button" class="chapter-pill" data-seg="2">
        <i class="pill-dot" aria-hidden="true"></i><span>古村清流</span>
      </button>
      <button type="button" class="chapter-pill" data-seg="3">
        <i class="pill-dot" aria-hidden="true"></i><span>叠瀑琼枝</span>
      </button>
      <button type="button" class="chapter-pill" data-seg="4">
        <i class="pill-dot" aria-hidden="true"></i><span>海洋金秋</span>
      </button>
      <button type="button" class="chapter-pill" data-seg="5">
        <i class="pill-dot" aria-hidden="true"></i><span>瑶风夜市</span>
      </button>
    </nav>
  </footer>

  <!-- 2.5D Painting Realm Bottom Dock: 4 Four-Season Day/Night Realms -->
  <footer id="depth-dock" class="bottom-dock depth-dock" hidden>
    <div class="depth-track-wrap">
      <span class="depth-edge-label">远观</span>
      <div id="depth-track" class="journey-track" role="slider" aria-label="步入画境深度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="15" tabindex="0">
        <div class="journey-rail"></div>
        <div id="depth-fill" class="journey-fill"></div>
        <div id="depth-thumb" class="journey-thumb"></div>
      </div>
      <span class="depth-edge-label">入画</span>
    </div>
    <div class="depth-controls">
      <div class="depth-scenes" role="group" aria-label="四季昼夜画境">
        <button type="button" class="chapter-pill active" data-depth-scene="haiyang">
          <i class="pill-dot" aria-hidden="true"></i><span>海洋秋村</span>
        </button>
        <button type="button" class="chapter-pill" data-depth-scene="lijiang">
          <i class="pill-dot" aria-hidden="true"></i><span>漓江桃洲</span>
        </button>
        <button type="button" class="chapter-pill" data-depth-scene="dajing">
          <i class="pill-dot" aria-hidden="true"></i><span>大境雾凇</span>
        </button>
        <button type="button" class="chapter-pill" data-depth-scene="paideng">
          <i class="pill-dot" aria-hidden="true"></i><span>牌灯夜游</span>
        </button>
      </div>
    </div>
  </footer>

  <!-- Subtle Card Backdrop for Tap-Outside Dismiss -->
  <div id="card-backdrop" class="card-backdrop" aria-hidden="true"></div>

  <!-- Upgraded Rice-Paper Cultural Gazetteer Sheet: 3-Layer Peep-in-Fan Diorama + 4-Section Deep Lore -->
  <aside id="detail-card" class="detail-card" aria-hidden="true" role="dialog" aria-labelledby="card-title">
    <div id="card-drag-bar" class="card-drag-bar">
      <div class="card-handle" aria-hidden="true"></div>
      <span id="card-cat" class="card-cat"></span>
      <button type="button" id="card-close" class="card-close" aria-label="关闭册页">×</button>
    </div>

    <div id="card-scroll" class="card-scroll">
      <!-- 1) Interactive 3-Layer Parallax Circular Fan Window ("画中窥景") -->
      <div class="fan-stage-wrap">
        <div id="fan-window" class="fan-window" title="左右轻拨圆窗体验三层立体景深">
          <div id="fan-bg" class="fan-layer fan-bg"></div>
          <div id="fan-mid" class="fan-layer fan-mid">
            <img id="card-img" src="" alt="">
          </div>
          <canvas id="fan-fx" class="fan-layer fan-fx" width="220" height="220" aria-hidden="true"></canvas>
          <div class="fan-rim" aria-hidden="true"></div>
        </div>
        <span class="fan-hint">轻拨圆窗 · 画中窥景</span>
      </div>

      <!-- 2) Header & Poetic Epigraph -->
      <div class="card-head-block">
        <div class="card-meta">
          <span id="card-zone" class="card-zone"></span>
          <span id="card-code" class="card-code"></span>
        </div>
        <h2 id="card-title" class="card-title"></h2>
        <p id="card-tagline" class="card-tagline"></p>
      </div>

      <!-- 3) Three-Cell Archival Data Strip -->
      <div class="fact-grid" aria-label="风物档案">
        <div class="fact-cell">
          <span class="fact-k">所属乡镇</span>
          <strong id="fact-town" class="fact-v"></strong>
        </div>
        <div class="fact-cell">
          <span class="fact-k">时令时段</span>
          <strong id="fact-season" class="fact-v"></strong>
        </div>
        <div class="fact-cell fact-cell-wide">
          <span class="fact-k">核心考据</span>
          <strong id="fact-stat" class="fact-v"></strong>
        </div>
      </div>

      <!-- 4) Scholarly Lore & Local Insider Tips -->
      <div class="lore-section">
        <h3 class="lore-h"><span>掌故与看点</span></h3>
        <p id="card-story" class="lore-p"></p>
      </div>

      <div class="lore-section lore-tips-box">
        <h3 class="lore-h"><span>在地行家贴士</span></h3>
        <p id="card-tips" class="lore-p"></p>
      </div>

      <!-- 5) Non-Obstructing Vermilion Check-in Actions -->
      <div class="card-actions">
        <button type="button" id="card-stamp-btn" class="card-stamp-btn">
          <span class="btn-seal" aria-hidden="true">印</span>
          <span id="card-stamp-label">盖章留念</span>
        </button>
        <button type="button" id="card-share-btn" class="card-share-btn">
          <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M10 3v9M6.5 6.5L10 3l3.5 3.5"/>
            <path d="M4 12.5v3a1.5 1.5 0 0 0 1.5 1.5h9a1.5 1.5 0 0 0 1.5-1.5v-3"/>
          </svg>
          <span>分享卡片</span>
        </button>
      </div>
      <div class="card-close-bar">
        <button type="button" id="card-close-bottom" aria-label="关闭册页">关闭</button>
      </div>
      <div id="card-inline-note" class="card-inline-note" aria-live="polite"></div>
    </div>
  </aside>

  <!-- Minimalist Scroll Preloader -->
  <div id="loader" class="loader">
    <div class="loader-inner">
      <div class="loader-seal">灵川</div>
      <div class="loader-track"><div id="loader-bar" class="loader-bar"></div></div>
      <p class="loader-text">展卷裁纸 · 三十二景入画 <span id="loader-pct">00</span>%</p>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
